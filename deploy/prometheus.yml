# Scraping-конфигурация для топологии §14.1.
# Prometheus видит проксирующие реплики, health-checker и сам себя.
# Внутри docker-сети публикация портов не требуется.

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    gateway: gateway_main

scrape_configs:
  - job_name: foa-gateway
    metrics_path: /metrics
    static_configs:
      - targets: ["gateway-a:8080", "gateway-b:8080"]
        labels: { component: gateway }
      - targets: ["health-checker:8080"]
        labels: { component: health-checker }
      - targets: ["discovery-worker:8080"]
        labels: { component: discovery-worker }

  - job_name: prometheus
    static_configs:
      - targets: ["127.0.0.1:9090"]
