[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "free-ollama-api-gateway"
version = "1.0.0"
description = "Управляемый прокси-шлюз с Ollama-совместимым API и consent gate для пула узлов Ollama"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Free Ollama API Gateway contributors" }]
keywords = ["ollama", "gateway", "proxy", "load-balancer", "consent"]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pyyaml>=6.0",
    "sqlalchemy>=2.0",
    "aiosqlite>=0.20",
    "alembic>=1.13",
    "prometheus-client>=0.20",
    "cryptography>=42.0",
    "PyJWT>=2.8",
    "dnspython>=2.6",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "ruff>=0.5", "mypy>=1.10"]
postgres = ["asyncpg>=0.29"]
redis = ["redis>=5.0"]

[project.scripts]
foa-gateway = "foa.app:main"
foa-owner = "foa.cli.owner:main"

[tool.setuptools.packages.find]
include = ["foa*"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["error::RuntimeWarning", "ignore::DeprecationWarning"]
addopts = "-q --strict-markers"
markers = [
    "slow: долгие тесты (нагрузочные, циклы ожидания)",
    "security: тесты безопасности (§15.3)",
    "ethics: этические тесты (§15.4)",
]

[tool.ruff]
line-length = 130
target-version = "py311"
src = ["foa", "tests"]

[tool.ruff.lint]
# RUF001–RUF003 отключены: текст проекта, комментариев, докстрингов и тестов —
# русский (ТЗ §1 написан на русском), поэтому «амбивалентные кириллические
# символы» срабатывают на каждом втором сообщении и только маскируют реальные
# замечания.
# UP042 отключён: Enum наследует (str, Enum) намеренно — значения уходят в JSON
# ответов и колонки БД как строки (§9.5, §10).
select = ["E", "F", "I", "UP", "B", "C4", "SIM", "RUF"]
ignore = ["E501", "B008", "RUF012", "SIM105", "B904", "RUF001", "RUF002", "RUF003", "UP042"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.mypy]
python_version = "3.11"
warn_unused_ignores = false
ignore_missing_imports = true
check_untyped_defs = false
