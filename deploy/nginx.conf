# Ingress для шлюза (§14.1 «ingress с TLS», §12.6).
#
# Пользовательский API и админ-контур публикуются раздельно: административные
# пути доступны только из служебной сети (§9.6), метрики наружу не отдаются
# вовсе (§11.4). Потоковые NDJSON-ответы идут без буферизации, иначе первый
# токен дойдёт до клиента только после завершения генерации (§8.4).

worker_processes auto;
error_log /var/log/nginx/error.log warn;

events { worker_connections 4096; }

http {
    # Ответы узлов и промпты в access-лог не пишем (§12.2, §12.5.2).
    log_format foa '$remote_addr [$time_local] "$request_method $uri" '
                   '$status req_time=$request_time upstream=$upstream_addr';
    access_log /var/log/nginx/access.log foa;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # Проксирующая роль — масштабирование по числу реплик (§14.1 «минимум 2 реплики»).
    upstream foa_gateway {
        least_conn;
        server gateway-a:8080 max_fails=3 fail_timeout=15s;
        server gateway-b:8080 max_fails=3 fail_timeout=15s;
        keepalive 64;
    }

    server {
        listen 443 ssl;
        http2 on;
        server_name _;

        ssl_certificate     /etc/nginx/tls/fullchain.pem;
        ssl_certificate_key /etc/nginx/tls/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;
        ssl_session_cache shared:TLS:10m;

        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;

        # Тело запроса ограничено и на уровне шлюза (limits.max_request_bytes),
        # но отсечка здесь дешевле (§12.4.6).
        client_max_body_size 2m;

        # -- пользовательский Ollama-совместимый API (§9.3) ---------------- #
        location /api/ {
            proxy_pass http://foa_gateway;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            # X-Forwarded-For не пробрасываем: шлюз передаёт владельцам только
            # обезличенный хэш клиента (§8.5.3, §12.5.2).
            proxy_buffering off;              # стриминг NDJSON без накопления (§8.4)
            proxy_request_buffering off;
            proxy_cache off;
            gzip off;                         # identity-кодирование для потоков (§8.4)
            proxy_read_timeout 330s;          # больше limits.max_generation_seconds (§7.1)
            proxy_send_timeout 330s;
        }

        location = /healthz { proxy_pass http://foa_gateway; }

        # -- админ-контур: только из служебной сети (§9.6) ----------------- #
        location /admin/ {
            allow 10.0.0.0/8;      # служебная сеть; при необходимости — mTLS
            allow 127.0.0.1;
            deny all;
            proxy_pass http://foa_gateway;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            client_max_body_size 1m;
        }

        # /metrics наружу не публикуется (§11.4): только из сети мониторинга.
        location /metrics {
            allow 10.0.0.0/8;
            deny all;
            proxy_pass http://foa_gateway;
        }

        # Всё остальное не обслуживается.
        location / { return 404; }
    }

    # HTTP только редиректит на HTTPS; ACME-валидация остаётся доступной.
    server {
        listen 80;
        server_name _;
        location /.well-known/acme-challenge/ { root /var/www/certbot; }
        location / { return 301 https://$host$request_uri; }
    }
}
