# Configurations для Alembic (§14.1, «Миграции» в README).
#
# URL берётся из env.py: ALEMBIC_DB_URL → GATEWAY_DB_URL → settings.storage.database_url
# (то есть та же цепочка §13/§14.2, что и у шлюза). Значение sqlalchemy.url ниже —
# только запасной вариант для локальных прогонов.
#
#   .venv/bin/alembic upgrade head      # применить миграции (используется и в apps)
#   .venv/bin/alembic revision --autogenerate -m "..."   # новая ревизия
#   .venv/bin/alembic check             # схема БД == models.py? (для CI)

[alembic]
script_location = migrations
prepend_sys_path = .
# Логгеры приложения (configure_logging в foa/logging) не глушим: миграции часто
# запускаются изнутри процесса шлюза (storage.migrations=alembic).
disable_existing_loggers = false
# Холостой URL: env.py переопределяет его из конфигурации шлюза.
sqlalchemy.url = sqlite+aiosqlite:///data/foagw.sqlite3

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
